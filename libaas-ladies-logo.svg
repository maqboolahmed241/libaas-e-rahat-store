 <path d="M48 75l27 48 27-48M38 130l37 28 37-28M26 205q49 25 98 0" fill="none" stroke="#e4bd71" stroke-width="2"/>
 <g fill="url(#gold)" stroke="none"><circle cx="75" cy="145" r="4"/><circle cx="60" cy="166" r="3"/><circle cx="90" cy="166" r="3"/><circle cx="75" cy="190" r="4"/><circle cx="49" cy="218" r="3"/><circle cx="101" cy="218" r="3"/></g>
 <path d="M30 105l-20 44 22 12M120 105l20 44-22 12" fill="none"/>
</g>
<!-- right elegant embroidered suit -->
<g transform="translate(965 84)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round">
 <circle cx="75" cy="26" r="23" fill="url(#rose)"/>
 <path d="M53 55 Q75 42 97 55 L117 105 L148 270 Q76 300 3 270 L33 105Z" fill="#72283f"/>
 <path d="M53 56 L29 105 L8 260 M97 56 L121 105 L143 260" fill="none"/>
 <path d="M55 67 Q75 93 95 67 L104 117 Q75 139 46 117Z" fill="#3b1325"/>
 <path d="M48 75l27 48 27-48M38 130l37 28 37-28M26 205q49 25 98 0" fill="none" stroke="#f0ce87" stroke-width="2"/>
