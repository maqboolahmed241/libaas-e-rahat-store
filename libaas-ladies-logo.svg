 <path d="M30 105l-20 44 22 12M120 105l20 44-22 12" fill="none"/>
</g>
<!-- crown -->
<path d="M525 88l26-39 48 35 48-35 28 39-19 25H544Z" fill="url(#gold)" stroke="#fff0c2" stroke-width="3" filter="url(#glow)"/>
<path d="M545 118H655" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
<text x="600" y="207" text-anchor="middle" font-family="Georgia,serif" font-size="66" font-weight="bold" letter-spacing="5" fill="url(#gold)">LIBAAS E RAAHAT</text>
