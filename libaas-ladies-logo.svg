<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">LIBAAS E RAAHAT Ladies Collection</title><desc id="desc">Black and gold luxury ladies fashion logo with two elegant embroidered dress illustrations, crown and Urdu brand name</desc>
<defs>
 <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset=".5" stop-color="#211016"/><stop offset="1" stop-color="#090909"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bd"/><stop offset=".28" stop-color="#c9963e"/><stop offset=".52" stop-color="#ffe5a0"/><stop offset="1" stop-color="#8f5c20"/></linearGradient>
 <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d9c8"/><stop offset="1" stop-color="#9d5264"/></linearGradient>
 <linearGradient id="dressblack" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292027"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="8" y="8" width="1184" height="404" rx="30" fill="url(#black)" stroke="url(#gold)" stroke-width="5"/>
<rect x="23" y="23" width="1154" height="374" rx="23" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
